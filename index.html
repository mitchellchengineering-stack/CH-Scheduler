<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CH Engineering — Build Scheduler</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#EDEEF0;
    --panel:#FFFFFF;
    --panel-2:#F7F7F8;
    --ink:#0B0C0C;
    --ink-soft:#5B6570;
    --line:#DADCDF;
    --line-strong:#BFC3C7;
    --yellow:#FEE300;
    --yellow-ink:#5A4F00;
    --steel:#3E4A55;
    --steel-soft:#8A939C;
    --red:#B23A2E;
    --red-bg:#FBEAE8;
    --green:#2F7D4F;
    --green-bg:#E9F4EE;
    --blue:#2C5F8A;
    --blue-bg:#E8F1F7;
    --orange:#B8791A;
    --orange-bg:#FBF1E2;
    --radius:3px;
    --shadow:0 1px 2px rgba(11,12,12,0.06), 0 1px 0 rgba(11,12,12,0.03);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;flex-direction:column;height:100vh;min-height:560px;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex;align-items:center;gap:16px;
    padding:10px 20px;
    background:var(--ink);
    border-bottom:3px solid var(--yellow);
    flex:0 0 auto;
  }
  .topbar img{height:46px;width:auto;display:block;}
  .logo-badge{background:#fff;padding:8px 14px;border-radius:4px;display:flex;align-items:center;line-height:0;}
  .topbar .divider{width:1px;height:26px;background:#3a3b3b;}
  .topbar h1{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:#EDEEF0;
    margin:0;
  }
  .topbar .sub{color:#9a9c9c;font-size:12px;margin-top:1px;}
  .topbar-spacer{flex:1;}
  .save-indicator{
    font-size:11.5px;color:#9a9c9c;
    display:flex;align-items:center;gap:6px;
    margin-right:6px;
    min-width:120px;
    justify-content:flex-end;
  }
  .save-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:0 0 auto;}
  .save-dot.saving{background:var(--yellow);}
  .drive-indicator{
    font-size:11.5px;color:#9a9c9c;
    display:flex;align-items:center;gap:6px;
    margin-right:6px;
    white-space:nowrap;
  }
  .drive-dot{width:6px;height:6px;border-radius:50%;background:#8a8b8b;flex:0 0 auto;}
  .drive-dot.connected{background:var(--green);}
  .drive-dot.syncing{background:var(--yellow);}
  .drive-dot.error{background:#E0483C;}

  .btn{
    appearance:none;border:none;cursor:pointer;
    font:inherit;font-weight:700;font-size:13px;
    padding:9px 16px;border-radius:var(--radius);
    display:inline-flex;align-items:center;gap:7px;
    transition:transform .06s ease, background .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--yellow);color:var(--ink);}
  .btn-primary:hover{background:#F5D900;}
  .btn-ghost{background:transparent;color:#EDEEF0;border:1px solid #4a4b4b;}
  .btn-ghost:hover{background:#232424;}
  .btn-secondary{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);}
  .btn-secondary:hover{background:#EFEFEF;}
  .btn-danger{background:transparent;color:var(--red);border:1px solid transparent;padding:6px 10px;}
  .btn-danger:hover{background:var(--red-bg);}
  .btn-sm{padding:6px 11px;font-size:12.5px;}
  .btn-icon{padding:6px 9px;}
  .btn[disabled]{opacity:0.45;cursor:not-allowed;}

  /* ---------- Layout ---------- */
  .body-row{flex:1;display:flex;min-height:0;}

  .sidebar{
    width:270px;flex:0 0 auto;
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    min-height:0;
  }
  .sidebar-head{
    padding:14px 16px 10px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .sidebar-head span{
    font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);
  }
  .job-search{margin:0 14px 10px;}
  .job-search input{
    width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);
    font:inherit;font-size:12.5px;background:var(--panel-2);
  }
  .job-search input:focus{outline:2px solid var(--yellow);outline-offset:-1px;background:var(--panel);}
  .job-list{flex:1;overflow-y:auto;padding:0 8px 12px;}
  .job-item{
    padding:10px 10px;margin-bottom:3px;border-radius:var(--radius);
    cursor:pointer;border:1px solid transparent;
  }
  .job-item:hover{background:var(--panel-2);}
  .job-item.active{background:#111213;border-color:#111213;}
  .job-item.active .job-item-name{color:#fff;}
  .job-item.active .job-item-meta{color:#B8BBBE;}
  .job-item-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .job-item-name{font-weight:700;font-size:13.5px;color:var(--ink);}
  .job-item-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .badge{
    font-size:10px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;
    padding:2.5px 7px;border-radius:20px;white-space:nowrap;
  }
  .badge-quoting{background:var(--panel-2);color:var(--ink-soft);border:1px solid var(--line-strong);}
  .badge-scheduled{background:var(--blue-bg);color:var(--blue);}
  .badge-progress{background:#FFF7CC;color:#7A6900;}
  .badge-complete{background:var(--green-bg);color:var(--green);}
  .badge-hold{background:var(--orange-bg);color:var(--orange);}

  .sidebar-empty{padding:20px 16px;color:var(--ink-soft);font-size:12.5px;}

  .main{flex:1;min-width:0;overflow-y:auto;padding:26px 32px 60px;}
  .main-inner{max-width:980px;margin:0 auto;}

  .welcome{
    max-width:520px;margin:60px auto;text-align:center;color:var(--ink-soft);
  }
  .welcome .roof{width:64px;height:64px;margin:0 auto 18px;}
  .welcome h2{color:var(--ink);font-size:19px;margin:0 0 8px;}
  .welcome p{font-size:13.5px;margin:0 0 20px;}

  /* ---------- Job header ---------- */
  .job-header{
    display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
    padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px;
  }
  .job-title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .job-title{font-size:22px;font-weight:800;letter-spacing:-0.01em;margin:0;}
  .job-meta-line{color:var(--ink-soft);font-size:13px;margin-top:5px;}
  .job-meta-line span:not(:last-child)::after{content:" · ";color:var(--line-strong);}
  .job-header-actions{display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;}

  /* page watermark (overview, quotes, timeline) */
  .main-inner{position:relative;}
  .page-watermark{
    position:absolute;top:40px;left:0;right:0;bottom:0;
    background-repeat:no-repeat;background-position:center top;background-size:560px auto;
    opacity:0.07;pointer-events:none;z-index:0;
  }
  .job-header,.tabs,#tabContent{position:relative;z-index:1;}

  /* quote margin / customer price cells */
  .margin-input{
    width:58px;padding:5px 6px;border:1px solid var(--line-strong);border-radius:var(--radius);
    font:inherit;font-size:12.5px;text-align:right;background:#fff;color:var(--ink);
  }
  .margin-input:focus{outline:2px solid var(--yellow);outline-offset:-1px;}
  .margin-cell{white-space:nowrap;}
  .margin-cell .unit{color:var(--ink-soft);font-size:11.5px;margin-left:3px;}
  .customer-price{font-weight:800;color:var(--green);}
  .cell-dash{color:var(--line-strong);}
  .quote-pdf-flag{color:var(--ink-soft);font-size:11.5px;margin-top:3px;}

  .tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--line);}
  .tab{
    padding:10px 4px;margin-right:22px;font-weight:700;font-size:13.5px;color:var(--ink-soft);
    cursor:pointer;border-bottom:2.5px solid transparent;user-select:none;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--ink);border-bottom-color:var(--yellow);}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px 22px;box-shadow:var(--shadow);}
  .panel + .panel{margin-top:16px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .panel-head h3{font-size:14px;margin:0;font-weight:800;}
  .panel-empty{padding:26px 4px;text-align:center;color:var(--ink-soft);font-size:13px;}
  .panel-empty strong{display:block;color:var(--ink);font-size:13.5px;margin-bottom:4px;}

  /* overview grid */
  .kv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px 22px;}
  .kv label{display:block;font-size:10.5px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;}
  .kv div.val{font-size:14px;font-weight:600;}
  .notes-box{white-space:pre-wrap;font-size:13.5px;color:var(--ink);line-height:1.6;}

  /* plans list (overview) */
  .plans-list{display:flex;flex-direction:column;gap:2px;}
  .plan-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 4px;border-bottom:1px solid var(--line);
  }
  .plan-item:last-child{border-bottom:none;}
  .plan-item-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .plan-icon{font-size:18px;flex:0 0 auto;}
  .plan-name{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px;cursor:pointer;}
  .plan-name:hover{text-decoration:underline;color:var(--blue);}
  .plan-meta{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}

  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
  .stat{
    flex:1;min-width:130px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;
  }
  .stat label{display:block;font-size:10.5px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;}
  .stat .num{font-size:19px;font-weight:800;}

  /* quotes table */
  table{width:100%;border-collapse:collapse;}
  th{
    text-align:left;font-size:10.5px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;
    color:var(--ink-soft);padding:0 10px 8px;border-bottom:1px solid var(--line);
  }
  td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  td.num-cell{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;}
  th.num-th{text-align:right;}
  .row-actions{display:flex;gap:4px;justify-content:flex-end;}
  .icon-btn{
    background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:4px 6px;border-radius:4px;font-size:12.5px;
  }
  .icon-btn:hover{background:var(--panel-2);color:var(--ink);}
  .total-row td{font-weight:800;border-top:2px solid var(--ink);border-bottom:none;padding-top:12px;}
  .status-pill{
    font-size:10.5px;font-weight:800;letter-spacing:0.03em;text-transform:uppercase;
    padding:3px 8px;border-radius:20px;
  }
  .status-pending{background:var(--panel-2);color:var(--ink-soft);border:1px solid var(--line-strong);}
  .status-waiting{background:var(--blue-bg);color:var(--blue);}
  .status-approved{background:var(--green-bg);color:var(--green);}
  .status-declined{background:var(--red-bg);color:var(--red);}
  .status-comparing{background:var(--orange-bg);color:var(--orange);}
  .quote-contact{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.5;}
  .quote-company{font-weight:700;}
  .quote-group-row td{padding:14px 10px 6px;border-bottom:none;}
  .quote-group-label{font-size:10.5px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-soft);}

  /* timeline */
  .gantt-wrap{overflow-x:auto;padding-bottom:6px;border:1px solid var(--line);border-radius:6px;}
  .gantt{display:inline-block;min-width:100%;}
  .gantt-scale-row{display:flex;position:sticky;top:0;background:var(--panel);z-index:2;border-bottom:1px solid var(--line-strong);}
  .gantt-scale-spacer{flex:0 0 190px;border-right:1px solid var(--line);}
  .gantt-day-cell{flex:0 0 auto;text-align:center;padding:6px 0 5px;border-right:1px solid var(--line);}
  .gantt-day-cell .dow{font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--ink-soft);letter-spacing:0.03em;}
  .gantt-day-cell .dom{font-size:12.5px;font-weight:700;margin-top:1px;}
  .gantt-day-cell.weekend{background:var(--panel-2);}
  .gantt-day-cell.weekend .dow,.gantt-day-cell.weekend .dom{color:var(--ink-soft);}
  .gantt-day-cell.is-today{background:#FFF7CC;}
  .gantt-day-cell.is-today .dow,.gantt-day-cell.is-today .dom{color:var(--ink);}
  .gantt-row{display:flex;align-items:stretch;border-bottom:1px solid var(--line);}
  .gantt-row:last-child{border-bottom:none;}
  .gantt-label{width:190px;flex:0 0 190px;padding:10px 14px;border-right:1px solid var(--line);background:var(--panel);position:sticky;left:0;z-index:1;}
  .gantt-label .trade{font-weight:700;font-size:13px;}
  .gantt-label .desc{font-size:11.5px;color:var(--ink-soft);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .gantt-track{position:relative;height:48px;}
  .gantt-grid{position:absolute;inset:0;display:flex;}
  .gantt-grid-cell{flex:0 0 auto;border-right:1px solid var(--line);height:100%;}
  .gantt-grid-cell.weekend{background:var(--panel-2);}
  .gantt-grid-cell.is-today{background:#FFF7CC;}
  .gantt-bar{
    position:absolute;top:9px;height:30px;border-radius:3px;
    display:flex;align-items:center;padding:0 9px;
    font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;
    cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,0.18);
    clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%);
  }
  .bar-scheduled{background:var(--blue);}
  .bar-progress{background:#B8960B;}
  .bar-complete{background:var(--green);}
  .bar-delayed{background:var(--red);}

  .gantt-tooltip{
    position:fixed;display:none;background:var(--ink);color:#fff;padding:10px 12px;
    border-radius:6px;font-size:12px;line-height:1.5;max-width:260px;z-index:300;pointer-events:none;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
  }
  .gantt-tooltip .tt-title{font-weight:800;font-size:12.5px;margin-bottom:3px;}
  .gantt-tooltip .tt-dates{color:#D8D9DB;margin-bottom:5px;}
  .gantt-tooltip .tt-desc{color:#EDEEF0;margin-bottom:5px;}
  .gantt-tooltip .tt-cost{color:var(--yellow);font-weight:800;}

  .legend{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);}
  .legend-swatch{width:10px;height:10px;border-radius:2px;}

  .tl-list{margin-top:18px;}
  .tl-list-item{
    display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
    padding:12px 4px;border-bottom:1px solid var(--line);
  }
  .tl-list-item:last-child{border-bottom:none;}
  .tl-left{display:flex;gap:12px;align-items:flex-start;}
  .tl-swatch{width:9px;height:9px;border-radius:2px;margin-top:5px;flex:0 0 auto;}
  .tl-trade{font-weight:700;font-size:13.5px;}
  .tl-desc{font-size:12.5px;color:var(--ink-soft);margin-top:2px;max-width:480px;}
  .tl-dates{font-size:12px;color:var(--ink-soft);margin-top:3px;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(11,12,12,0.45);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal{
    background:var(--panel);border-radius:8px;width:100%;max-width:460px;
    max-height:88vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  .modal-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 20px;border-bottom:1px solid var(--line);
  }
  .modal-head h3{margin:0;font-size:15px;font-weight:800;}
  .modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);line-height:1;padding:4px;}
  .modal-close:hover{color:var(--ink);}
  .modal-body{padding:18px 20px;}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;font-weight:800;letter-spacing:0.03em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select,.field textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);
    font:inherit;font-size:13.5px;background:#fff;color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--yellow);outline-offset:-1px;}
  .field textarea{resize:vertical;min-height:64px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}
  .field-hint{font-size:11px;color:var(--ink-soft);margin-top:4px;}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#C6C9CC;border-radius:6px;border:2px solid var(--bg);}
  ::-webkit-scrollbar-track{background:var(--bg);}

  @media (max-width:760px){
    .sidebar{width:210px;}
    .main{padding:20px 16px 60px;}
    .gantt-label{width:120px;flex-basis:120px;}
    .gantt-scale{padding-left:120px;}
  }
</style>
</head>
<body>

<script>
(function(){

  // ---------------- Storage helpers ----------------
  // Standalone file: data is kept in this browser's IndexedDB, on this computer,
  // so it survives closing the tab/file and reopening it later — no account or internet needed.
  // IndexedDB (not localStorage) is used because uploaded plan files (PDFs/images stored
  // as base64) are large, and localStorage's ~5-10MB per-site cap gets blown through almost
  // immediately once a couple of plan files are attached — that silent cap is what was
  // causing plans to "fail to save" / not stick after reload.
  const STORAGE_PREFIX = 'ch-scheduler:';
  const DB_NAME = 'ch-scheduler-db';
  const DB_STORE = 'kv';
  let _dbPromise = null;

  function openDb(){
    if(_dbPromise) return _dbPromise;
    _dbPromise = new Promise((resolve, reject)=>{
      const req = window.indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
    return _dbPromise;
  }

  function idbGet(key){
    return openDb().then(db=> new Promise((resolve, reject)=>{
      const tx = db.transaction(DB_STORE, 'readonly');
      const req = tx.objectStore(DB_STORE).get(key);
      req.onsuccess = ()=> resolve(req.result === undefined ? null : req.result);
      req.onerror = ()=> reject(req.error);
    }));
  }

  function idbSet(key, value){
    return openDb().then(db=> new Promise((resolve, reject)=>{
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(value, key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    }));
  }

  function idbDelete(key){
    return openDb().then(db=> new Promise((resolve, reject)=>{
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).delete(key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    }));
  }

  // One-time migration: earlier versions of this app kept everything in localStorage.
  // Copy any of that older data into IndexedDB the first time this runs so existing
  // jobs aren't lost, then leave the old localStorage keys alone (harmless leftovers).
  let _migrated = false;
  async function migrateFromLocalStorageOnce(){
    if(_migrated) return;
    _migrated = true;
    try{
      const existing = await idbGet(STORAGE_PREFIX+'job-index');
      if(existing !== null) return; // IndexedDB already has data — nothing to migrate
      for(let i=0;i<window.localStorage.length;i++){
        const k = window.localStorage.key(i);
        if(k && k.indexOf(STORAGE_PREFIX) === 0){
          const v = window.localStorage.getItem(k);
          if(v !== null) await idbSet(k, v);
        }
      }
    }catch(e){ /* no localStorage data to migrate, or migration failed — safe to continue */ }
  }

  async function storageSet(key, value){

      return true;

      alert('Could not save — your browser storage may be full or blocked. '+(e && e.message ? e.message : ''));

  function initGoogleAuth(){
    if(!driveConfigured()) return;
    if(!(window.google && google.accounts && google.accounts.oauth2)){
      // Google's script hasn't finished loading yet — try again shortly.
      setTimeout(initGoogleAuth, 300);
      return;
    }
    driveTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPES,
      callback: (resp) => {
        if(resp.error){
          setDriveStatus('error', 'Drive: sign-in failed');
          return;
        }
        driveAccessToken = resp.access_token;
        driveTokenExpiresAt = Date.now() + ((resp.expires_in||3600)*1000) - 60000;
        driveConnected = true;
        try{ localStorage.setItem(DRIVE_EVER_CONNECTED_KEY, '1'); }catch(e){}
        setDriveStatus('connected', 'Drive: connected');
      }
    });
    attemptSilentDriveReconnect();

  // If you've connected Drive successfully at least once before, quietly try
  // to reconnect in the background on every page load — no popup, no
  // "Connect Drive" click needed — as long as you're still signed into

  function attemptSilentDriveReconnect(){
    let everConnected = false;
    try{ everConnected = localStorage.getItem(DRIVE_EVER_CONNECTED_KEY) === '1'; }catch(e){}
    if(!everConnected || !driveTokenClient) return;
    const prevCallback = driveTokenClient.callback;
    driveTokenClient.callback = (resp) => {
      driveTokenClient.callback = prevCallback;
      if(resp.error) return; // quietly stay disconnected — no error UI on a background attempt
      driveAccessToken = resp.access_token;
      driveTokenExpiresAt = Date.now() + ((resp.expires_in||3600)*1000) - 60000;
      driveConnected = true;
      setDriveStatus('connected', 'Drive: connected');
    };
    driveTokenClient.requestAccessToken({prompt:''});
  }


  function connectDrive(){

      return;
    }
    if(!driveTokenClient){
      alert('Google sign-in is still loading — please try again in a moment.');
      initGoogleAuth();

    }
    driveTokenClient.requestAccessToken({prompt: driveAccessToken ? '' : 'consent'});
  }

  async function ensureDriveToken(){
    if(driveConnected && driveAccessToken && Date.now() < driveTokenExpiresAt) return true;
    return new Promise((resolve)=>{
      if(!driveTokenClient){ resolve(false); return; }
      const prevCallback = driveTokenClient.callback;
      driveTokenClient.callback = (resp)=>{
        driveTokenClient.callback = prevCallback;
        if(resp.error){ driveConnected = false; setDriveStatus('error'); resolve(false); return; }
        driveAccessToken = resp.access_token;
        driveTokenExpiresAt = Date.now() + ((resp.expires_in||3600)*1000) - 60000;
        driveConnected = true;
        try{ localStorage.setItem(DRIVE_EVER_CONNECTED_KEY, '1'); }catch(e){}
        setDriveStatus('connected', 'Drive: connected');
        resolve(true);
      };
      driveTokenClient.requestAccessToken({prompt:''});
    });
  }

  async function driveFetch(url, opts){
    opts = opts || {};
    opts.headers = Object.assign({Authorization: 'Bearer '+driveAccessToken}, opts.headers||{});
    const res = await fetch(url, opts);
    if(res.status === 401){
      driveConnected = false;
      setDriveStatus('error', 'Drive: reconnect needed');
      throw new Error('Drive sign-in expired — click Reconnect.');
    }
    if(!res.ok){
      const body = await res.text().catch(()=> '');
      throw new Error('Drive API error '+res.status+' '+body.slice(0,200));
    }
    return res.json();
  }

  async function driveCreateFolder(name, parentId){
    return driveFetch('https://www.googleapis.com/drive/v3/files?fields=id,name,webViewLink', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, mimeType:'application/vnd.google-apps.folder', parents:[parentId]})
    });
  }

  async function driveFindChildFolder(name, parentId){
    const safe = name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const q = "name='"+safe+"' and mimeType='application/vnd.google-apps.folder' and '"+parentId+"' in parents and trashed=false";
    const data = await driveFetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id,name)');
    return (data.files && data.files[0]) || null;
  }

  async function driveFindOrCreateChildFolder(name, parentId){
    const existing = await driveFindChildFolder(name, parentId);
    if(existing) return existing;
    return driveCreateFolder(name, parentId);
  }

  async function driveUploadFile(dataUri, filename, folderId){
    const commaIdx = dataUri.indexOf(',');
    const meta = dataUri.slice(5, commaIdx); // "mime;base64"
    const mimeType = meta.split(';')[0] || 'application/octet-stream';
    const base64 = dataUri.slice(commaIdx+1);
    const boundary = 'chsched_'+Math.random().toString(36).slice(2);
    const metadataPart = {name: filename, parents:[folderId]};
    const body =
      '--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(metadataPart)+'\r\n'+
      '--'+boundary+'\r\nContent-Type: '+mimeType+'\r\nContent-Transfer-Encoding: base64\r\n\r\n'+base64+'\r\n'+
      '--'+boundary+'--';
    return driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', {
      method:'POST',
      headers:{'Content-Type':'multipart/related; boundary='+boundary},
      body
    });
  }

  function quoteMargin(q){
    const m = Number(q && q.margin);
    return (q && q.margin!==undefined && q.margin!==null && q.margin!=='' && !isNaN(m)) ? m : DEFAULT_MARGIN;
  }
  function customerPrice(q){
    if(!q || q.status!=='Approved') return null;
    const amt = Number(q.amount)||0;
    return amt + amt*(quoteMargin(q)/100);
  }
  function getEntryCost(job, entry){
    // Prefer an explicitly linked quote, fall back to matching by trade name (legacy data)
    if(entry && entry.quoteId){
      const q = (job.quotes||[]).find(x=>x.id===entry.quoteId);
      if(q) return {amount:Number(q.amount)||0, customer:customerPrice(q), quote:q};
    }
    const tradeName = entry ? entry.trade : null;
    if(!tradeName) return null;
    const needle = tradeName.trim().toLowerCase();
    if(!needle) return null;
    const matches = (job.quotes||[]).filter(q=>(q.trade||'').trim().toLowerCase()===needle);
    if(matches.length === 0) return null;
    const approved = matches.filter(q=>q.status==='Approved');
    const pool = approved.length ? approved : matches;
    const amount = pool.reduce((s,q)=>s+(Number(q.amount)||0),0);
    const customer = approved.length ? approved.reduce((s,q)=>s+(customerPrice(q)||0),0) : null;
    return {amount, customer, quote: pool.length===1 ? pool[0] : null};
  }

  function readFileAsDataURL(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = ()=> reject(reader.error);
      reader.readAsDataURL(file);
    });
  }
  function openPdfDataUri(dataUri, filename){
    try{
      const parts = dataUri.split(',');
      const meta = parts[0];
      const b64 = parts[1];
      const mime = (meta.match(/data:([^;]+)/)||[])[1] || 'application/pdf';
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      const blob = new Blob([bytes], {type:mime});
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(()=>URL.revokeObjectURL(url), 60000);
    }catch(e){
      // fall back to opening the data URI directly
      window.open(dataUri, '_blank');
    }
  }

    return /\.(png|jpe?g|gif|webp|heic|heif|bmp)$/i.test(name||'');

  function money(n){
    n = Number(n)||0;
    return '$' + n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

  function fmtDate(d){
    if(!d) return '';
    const dt = new Date(d+'T00:00:00');
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

        '</div>'+
      '</div>'+

        try{

          job.plans.push({id:uid(), name:file.name, fileData:dataUrl, added:new Date().toISOString().slice(0,10)});

      renderMain();

        job.plans = (job.plans||[]).filter(x=>x.id!==btn.getAttribute('data-del-plan'));
        await saveJob(job);
        renderMain();
      });
    });

  // ---------------- Quotes ----------------
  function contactLine(q){
    const parts = [];
    if(q.contactName) parts.push(esc(q.contactName));
    if(q.email) parts.push(esc(q.email));
    if(q.phone) parts.push(esc(q.phone));
    return parts.length ? '<div class="quote-contact">'+parts.join(' · ')+'</div>' : '';
  }

  function renderQuotesTab(container, job){

    const sorted = quotes.slice().sort((a,b)=>{

        '<table><thead><tr><th>Description</th><th>Company &amp; contact</th><th>Status</th><th class="num-th">Amount</th><th class="num-th">Margin</th><th class="num-th">Charge customer</th><th></th></tr></thead>'+
        '<tbody>'+rows+
        (quotes.length ? '<tr class="total-row"><td colspan="3">Approved total</td><td class="num-cell">'+money(approvedTotal)+'</td><td></td><td class="num-cell">'+money(approvedCustomerTotal)+'</td><td></td></tr>' : '')+
        '</tbody></table>'+

  // ---------------- Timeline ----------------
  const DAY_WIDTH = 42; // px per day column
  const DAY_MS = 24*60*60*1000;

  function sameDate(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

  function getTradeCost(job, tradeName){
    if(!tradeName) return null;
    const needle = tradeName.trim().toLowerCase();
    if(!needle) return null;
    const matches = (job.quotes||[]).filter(q=>(q.trade||'').trim().toLowerCase()===needle);
    if(matches.length === 0) return null;
    const approved = matches.filter(q=>q.status==='Approved');
    const pool = approved.length ? approved : matches;
    return pool.reduce((s,q)=>s+(Number(q.amount)||0),0);
  }

  function ensureTooltip(){
    let tip = document.getElementById('ganttTooltip');
    if(!tip){
      tip = document.createElement('div');
      tip.id = 'ganttTooltip';
      tip.className = 'gantt-tooltip';
      document.body.appendChild(tip);
    }
    return tip;
  }
  function showGanttTooltip(barEl, e, job){
    const tip = ensureTooltip();
    const info = getEntryCost(job, e);
    const dateStr = fmtDate(e.start) + (e.end && e.end!==e.start ? ' – '+fmtDate(e.end) : '');
    let costLine = 'No quote linked for this trade';
    if(info){
      costLine = money(info.amount);
      if(info.customer!==null && info.customer!==undefined) costLine += ' · charge '+money(info.customer);
    }
    tip.innerHTML =
      '<div class="tt-title">'+esc(e.trade)+'</div>'+
      '<div class="tt-dates">'+dateStr+'</div>'+
      '<div class="tt-desc">'+(e.description ? esc(e.description) : 'No description added')+'</div>'+
      '<div class="tt-cost">'+costLine+'</div>';
    tip.style.display = 'block';
    const rect = barEl.getBoundingClientRect();
    const tipRect = tip.getBoundingClientRect();
    let left = rect.left + rect.width/2 - tipRect.width/2;
    left = Math.max(8, Math.min(left, window.innerWidth - tipRect.width - 8));
    let top = rect.top - tipRect.height - 10;
    if(top < 8) top = rect.bottom + 10;
    tip.style.left = left+'px';
    tip.style.top = top+'px';
  }
  function hideGanttTooltip(){
    const tip = document.getElementById('ganttTooltip');
    if(tip) tip.style.display = 'none';
  }

  function renderTimelineTab(container, job){
    const entries = (job.timeline||[]).slice().sort((a,b)=> (a.start||'').localeCompare(b.start||''));
    let ganttHtml = '';
    if(entries.length === 0){
      ganttHtml = '<div class="panel-empty"><strong>No trades scheduled yet</strong>Add trades with their dates and a description of the work to build the timeline.</div>';
    } else {
      const starts = entries.map(e=>e.start).filter(Boolean);
      const ends = entries.map(e=>e.end||e.start).filter(Boolean);
      const today = new Date(); today.setHours(0,0,0,0);
      // Always include today in the range, even if no trade is scheduled
      // on/around it — otherwise there's no column left to highlight.
      let minD = new Date(Math.min(today.getTime(), ...starts.map(d=>new Date(d+'T00:00:00').getTime())));
      let maxD = new Date(Math.max(today.getTime(), ...ends.map(d=>new Date(d+'T00:00:00').getTime())));
      // pad range by a day each side for readability
      minD.setDate(minD.getDate()-1);
      maxD.setDate(maxD.getDate()+1);
      const totalDays = Math.max(1, Math.round((maxD-minD)/DAY_MS)+1);

      let dayCellsHeader = '';
      let dayCellsGrid = '';
      for(let d=0; d<totalDays; d++){
        const dt = new Date(minD.getTime() + d*DAY_MS);
        const isWeekend = dt.getDay()===0 || dt.getDay()===6;
        const isToday = sameDate(dt, today);
        const cls = (isWeekend?' weekend':'')+(isToday?' is-today':'');
        dayCellsHeader += '<div class="gantt-day-cell'+cls+'" style="width:'+DAY_WIDTH+'px">'+
          '<div class="dow">'+dt.toLocaleDateString(undefined,{weekday:'short'})+'</div>'+
          '<div class="dom">'+dt.getDate()+'</div>'+
        '</div>';
        dayCellsGrid += '<div class="gantt-grid-cell'+cls+'" style="width:'+DAY_WIDTH+'px"></div>';
      }
      const totalWidth = totalDays*DAY_WIDTH;

      const rows = entries.map(e=>{
        const s = new Date((e.start||minD.toISOString().slice(0,10))+'T00:00:00');
        const en = new Date((e.end||e.start||minD.toISOString().slice(0,10))+'T00:00:00');
        const daysFromStart = Math.round((s-minD)/DAY_MS);
        const spanDays = Math.max(1, Math.round((en-s)/DAY_MS)+1);
        const left = daysFromStart*DAY_WIDTH + 2;
        const width = spanDays*DAY_WIDTH - 4;
        const cls = TL_BAR_CLASS[e.status] || 'bar-scheduled';
        return '<div class="gantt-row">'+
          '<div class="gantt-label"><div class="trade">'+esc(e.trade)+'</div>'+(e.description?'<div class="desc">'+esc(e.description)+'</div>':'')+'</div>'+
          '<div class="gantt-track" style="width:'+totalWidth+'px">'+
            '<div class="gantt-grid">'+dayCellsGrid+'</div>'+
            '<div class="gantt-bar '+cls+'" style="left:'+left+'px;width:'+width+'px" data-edit="'+e.id+'" data-hover="'+e.id+'">'+esc(e.trade)+'</div>'+
          '</div>'+
        '</div>';
      }).join('');

      ganttHtml =
        '<div class="gantt-wrap"><div class="gantt">'+
          '<div class="gantt-scale-row"><div class="gantt-scale-spacer"></div>'+dayCellsHeader+'</div>'+
          rows+
        '</div></div>'+
        '<div class="legend">'+
          legendItem('bar-scheduled','Scheduled')+legendItem('bar-progress','In progress')+
          legendItem('bar-complete','Complete')+legendItem('bar-delayed','Delayed')+
        '</div>';
    }

    const listHtml = entries.length ? entries.map(e=>{
      const cls = TL_BAR_CLASS[e.status] || 'bar-scheduled';
      const info = getEntryCost(job, e);
      let costStr = '';
      if(info){
        costStr = ' · '+money(info.amount);
        if(info.customer!==null && info.customer!==undefined) costStr += ' (charge '+money(info.customer)+')';
      }
      return '<div class="tl-list-item">'+
        '<div class="tl-left"><div class="tl-swatch '+cls+'"></div>'+
          '<div><div class="tl-trade">'+esc(e.trade)+'</div>'+
          (e.description ? '<div class="tl-desc">'+esc(e.description)+'</div>' : '')+
          '<div class="tl-dates">'+fmtDate(e.start)+(e.end && e.end!==e.start ? ' – '+fmtDate(e.end) : '')+' · '+esc(e.status)+costStr+'</div></div>'+
        '</div>'+
        '<div class="row-actions"><button class="icon-btn" data-edit2="'+e.id+'">Edit</button><button class="icon-btn" data-del2="'+e.id+'">Remove</button></div>'+
      '</div>';
    }).join('') : '';

    container.innerHTML =
      '<div class="panel">'+
        '<div class="panel-head"><h3>Trade timeline</h3><button class="btn btn-primary btn-sm" id="addTlBtn">+ Add trade</button></div>'+
        ganttHtml+
        (listHtml ? '<div class="tl-list">'+listHtml+'</div>' : '')+
      '</div>';

    document.getElementById('addTlBtn').addEventListener('click', ()=>openTimelineModal(job, null));
    const ganttWrap = container.querySelector('.gantt-wrap');
    const todayCol = container.querySelector('.gantt-grid-cell.is-today');
    if(ganttWrap && todayCol){
      // Bring today's column into view rather than leaving the user to
      // scroll and hunt for it, especially now the range can extend well
      // past whatever trades happen to be scheduled.
      const targetLeft = todayCol.offsetLeft - (ganttWrap.clientWidth/2) + (todayCol.offsetWidth/2);
      ganttWrap.scrollLeft = Math.max(0, targetLeft);
    }
    container.querySelectorAll('[data-edit]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const e = job.timeline.find(x=>x.id===el.getAttribute('data-edit'));
        openTimelineModal(job, e);
      });
    });
    container.querySelectorAll('[data-hover]').forEach(el=>{
      el.addEventListener('mouseenter', ()=>{
        const e = job.timeline.find(x=>x.id===el.getAttribute('data-hover'));
        if(e) showGanttTooltip(el, e, job);
      });
      el.addEventListener('mouseleave', hideGanttTooltip);
    });
    container.querySelectorAll('[data-edit2]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const e = job.timeline.find(x=>x.id===el.getAttribute('data-edit2'));
        openTimelineModal(job, e);
      });
    });
    container.querySelectorAll('[data-del2]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        if(!confirm('Remove this trade from the timeline?')) return;
        job.timeline = job.timeline.filter(x=>x.id!==el.getAttribute('data-del2'));
        await saveJob(job);
        renderMain();
      });
    });
  }
  function legendItem(cls,label){
    return '<div class="legend-item"><span class="legend-swatch '+cls+'"></span>'+label+'</div>';
  }

  // ---------------- Export: PDF ----------------
  function safeFileName(s){
    return (s||'job').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_') || 'job';
  }

  function exportJobPDF(job){
    if(!(window.jspdf && window.jspdf.jsPDF)){
      alert('PDF export library is still loading — please try again in a moment.');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const pageWidth = doc.internal.pageSize.getWidth();
    const margin = 40;
    let y = 40;

    if(LOGO_DATA_URI){
      // Logo's natural aspect ratio is roughly 4:1 (wide banner) — keep it
      // proportional instead of squashing it into a fixed box.
      try{ doc.addImage(LOGO_DATA_URI, 'PNG', margin, y, 150, 37.7); }catch(e){}
    }
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text(job.name||'Job', pageWidth-margin, y+14, {align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,90,90);
    doc.text('CH Engineering — Build Scheduler', pageWidth-margin, y+30, {align:'right'});
    doc.setTextColor(0,0,0);
    y += 60;
    doc.setDrawColor(220,220,220); doc.line(margin, y, pageWidth-margin, y);
    y += 22;

    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text('Overview', margin, y);
    y += 16;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const overviewLines = [
      ['Client', job.client||'—'],
      ['Job type', job.type||'—'],
      ['Status', job.status||'—'],
      ['Address / site', job.address||'—']
    ];
    overviewLines.forEach(([label,val])=>{
      doc.setFont('helvetica','bold'); doc.text(label+':', margin, y);
      doc.setFont('helvetica','normal'); doc.text(String(val), margin+110, y);
      y += 16;
    });
    if(job.notes){
      y += 6;
      doc.setFont('helvetica','bold'); doc.text('Notes:', margin, y); y += 14;
      doc.setFont('helvetica','normal');
      const noteLines = doc.splitTextToSize(job.notes, pageWidth-margin*2);
      doc.text(noteLines, margin, y);
      y += noteLines.length*13;
    }
    y += 10;

    const quotes = job.quotes || [];
    const approvedTotal = quotes.filter(q=>q.status==='Approved').reduce((s,q)=>s+(Number(q.amount)||0),0);
    const approvedCustomerTotal = quotes.filter(q=>q.status==='Approved').reduce((s,q)=>s+(customerPrice(q)||0),0);

    doc.autoTable({
      startY: y,
      margin: {left:margin, right:margin},
      head: [['Description','Company','Status','Amount','Margin','Charge customer']],
      body: quotes.length ? quotes.map(q=>[
        q.description||'', q.trade||'—', q.status||'Not sent yet',
        money(q.amount), q.status==='Approved' ? quoteMargin(q)+'%' : '—',
        customerPrice(q)!==null ? money(customerPrice(q)) : '—'
      ]) : [['No quotes added yet.','','','','','']],
      foot: quotes.length ? [['','','Approved total', money(approvedTotal), '', money(approvedCustomerTotal)]] : [],
      styles:{fontSize:9, cellPadding:5},
      headStyles:{fillColor:[11,12,12], textColor:255},
      footStyles:{fillColor:[240,240,240], textColor:20, fontStyle:'bold'},
      theme:'grid'
    });
    y = doc.lastAutoTable.finalY + 26;

    if(y > doc.internal.pageSize.getHeight()-120){ doc.addPage(); y = 40; }
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text('Trade timeline', margin, y);
    y += 10;

    const timeline = (job.timeline||[]).slice().sort((a,b)=>(a.start||'').localeCompare(b.start||''));
    doc.autoTable({
      startY: y+8,
      margin: {left:margin, right:margin},
      head: [['Trade','Description','Start','End','Status','Cost']],
      body: timeline.length ? timeline.map(e=>{
        const info = getEntryCost(job, e);
        return [
          e.trade||'', e.description||'', fmtDate(e.start), fmtDate(e.end)||fmtDate(e.start), e.status||'',
          info ? money(info.amount) : '—'
        ];
      }) : [['No trades scheduled yet.','','','','','']],
      styles:{fontSize:9, cellPadding:5},
      headStyles:{fillColor:[11,12,12], textColor:255},
      theme:'grid'
    });

    doc.save(safeFileName(job.name)+'.pdf');
  }

  // ---------------- Export: Spreadsheet ----------------
  function exportJobSpreadsheet(job){
    if(!window.XLSX){
      alert('Spreadsheet export library is still loading — please try again in a moment.');
      return;
    }
    const wb = XLSX.utils.book_new();

    const overviewRows = [
      ['Job name', job.name||''],
      ['Client', job.client||''],
      ['Job type', job.type||''],
      ['Status', job.status||''],
      ['Address / site', job.address||''],
      [],
      ['Notes'],
      [job.notes||'']
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(overviewRows), 'Overview');

    const quotes = job.quotes || [];
    const quoteRows = [['Description','Company','Contact name','Phone','Email','Status','Amount','Margin %','Charge customer']];
    quotes.forEach(q=>{
      quoteRows.push([
        q.description||'', q.trade||'', q.contactName||'', q.phone||'', q.email||'',
        q.status||'', Number(q.amount)||0,
        q.status==='Approved' ? quoteMargin(q) : '',
        q.status==='Approved' ? (customerPrice(q)||0) : ''
      ]);
    });
    const approvedTotal = quotes.filter(q=>q.status==='Approved').reduce((s,q)=>s+(Number(q.amount)||0),0);
    const approvedCustomerTotal = quotes.filter(q=>q.status==='Approved').reduce((s,q)=>s+(customerPrice(q)||0),0);
    quoteRows.push([]);
    quoteRows.push(['','','','','','Approved total', approvedTotal, '', approvedCustomerTotal]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(quoteRows), 'Quotes');

    const timeline = (job.timeline||[]).slice().sort((a,b)=>(a.start||'').localeCompare(b.start||''));
    const tlRows = [['Trade','Description','Start','End','Status','Linked quote','Cost']];
    timeline.forEach(e=>{
      const info = getEntryCost(job, e);
      const linkedDesc = info && info.quote ? info.quote.description : '';
      tlRows.push([e.trade||'', e.description||'', e.start||'', e.end||'', e.status||'', linkedDesc, info ? info.amount : '']);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(tlRows), 'Timeline');

    XLSX.writeFile(wb, safeFileName(job.name)+'.xlsx');
  }

  // ---------------- Modals ----------------
  function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

  function openModal(html){
    document.getElementById('modalRoot').innerHTML =
      '<div class="modal-overlay" id="modalOverlay"><div class="modal">'+html+'</div></div>';
    document.getElementById('modalOverlay').addEventListener('click', (e)=>{
      if(e.target.id === 'modalOverlay') closeModal();
    });
  }

  function openNewJobModal(){ openJobModal(null); }

  function openJobModal(job){
    const isEdit = !!job;
    const statusOpts = STATUS_OPTS.map(s=>'<option value="'+s+'"'+(job&&job.status===s?' selected':'')+'>'+s+'</option>').join('');
    openModal(
      '<div class="modal-head"><h3>'+(isEdit?'Edit job':'New job')+'</h3><button class="modal-close" id="mClose">&times;</button></div>'+
      '<div class="modal-body">'+
        '<div class="field"><label>Job name</label><input id="fName" type="text" value="'+esc(job?job.name:'')+'" placeholder="e.g. 14 Ridge Road – New Build"></div>'+
        '<div class="field-row">'+
          '<div class="field"><label>Client</label><input id="fClient" type="text" value="'+esc(job?job.client:'')+'" placeholder="Client name"></div>'+
          '<div class="field"><label>Job type</label><select id="fType"><option '+(job&&job.type==='Residential'?'selected':'')+'>Residential</option><option '+(job&&job.type==='Commercial'?'selected':'')+'>Commercial</option></select></div>'+
        '</div>'+
        '<div class="field"><label>Address / site</label><input id="fAddress" type="text" value="'+esc(job?job.address:'')+'" placeholder="Site address"></div>'+
        '<div class="field"><label>Status</label><select id="fStatus">'+statusOpts+'</select></div>'+
        '<div class="field"><label>Notes</label><textarea id="fNotes" placeholder="Access notes, special requirements...">'+esc(job?job.notes:'')+'</textarea></div>'+
      '</div>'+
      '<div class="modal-foot"><button class="btn btn-secondary" id="mCancel">Cancel</button><button class="btn btn-primary" id="mSave">'+(isEdit?'Save changes':'Create job')+'</button></div>'
    );
    document.getElementById('mClose').addEventListener('click', closeModal);
    document.getElementById('mCancel').addEventListener('click', closeModal);
    document.getElementById('mSave').addEventListener('click', async ()=>{
      const name = document.getElementById('fName').value.trim();
      if(!name){ document.getElementById('fName').focus(); return; }
      const data = {
        name,
        client: document.getElementById('fClient').value.trim(),
        type: document.getElementById('fType').value,
        address: document.getElementById('fAddress').value.trim(),
        status: document.getElementById('fStatus').value,
        notes: document.getElementById('fNotes').value.trim()
      };
      if(isEdit){
        Object.assign(job, data);
        await saveJob(job);
        const idxItem = jobIndex.find(j=>j.id===job.id);
        Object.assign(idxItem, indexEntryFromJob(job));
      } else {
        const newJob = Object.assign({id:uid(), quotes:[], timeline:[], plans:[]}, data);
        await saveJob(newJob);
        jobIndex.push(indexEntryFromJob(newJob));
        currentJobId = newJob.id;
        if(driveConnected){ createDriveStructureForJob(newJob); }
      }
      await saveIndex();
      closeModal();
      renderSidebar();
      renderMain();
    });
  }

  async function deleteJob(job){
    if(!confirm('Delete "'+job.name+'" and all its quotes and timeline entries? This can\'t be undone.')) return;
    jobIndex = jobIndex.filter(j=>j.id!==job.id);
    delete jobs[job.id];
    await saveIndex();
    await storageDelete('job:'+job.id);
    if(currentJobId === job.id) currentJobId = null;
    renderSidebar();
    renderMain();
  }

  function openQuoteModal(job, item){
    const isEdit = !!item;
    const defaultStatus = item ? item.status : 'Not sent yet';
    const statusOpts = QUOTE_STATUS.map(s=>'<option '+(defaultStatus===s?'selected':'')+'>'+s+'</option>').join('');
    openModal(
      '<div class="modal-head"><h3>'+(isEdit?'Edit quote':'Add quote')+'</h3><button class="modal-close" id="mClose">&times;</button></div>'+
      '<div class="modal-body">'+
        '<div class="field"><label>Description</label><input id="qDesc" type="text" value="'+esc(item?item.description:'')+'" placeholder="e.g. Steel frame &amp; truss supply"></div>'+
        '<div class="field"><label>Company</label><input id="qTrade" type="text" value="'+esc(item?item.trade:'')+'" placeholder="e.g. CH Engineering"></div>'+
        '<div class="field-row">'+
          '<div class="field"><label>Contact name</label><input id="qContact" type="text" value="'+esc(item?item.contactName:'')+'" placeholder="Contact name"></div>'+
          '<div class="field"><label>Phone</label><input id="qPhone" type="text" value="'+esc(item?item.phone:'')+'" placeholder="Phone number"></div>'+
        '</div>'+
        '<div class="field"><label>Email</label><input id="qEmail" type="email" value="'+esc(item?item.email:'')+'" placeholder="email@example.com"></div>'+
        '<div class="field-row">'+
          '<div class="field"><label>Amount (NZD)</label><input id="qAmount" type="number" step="0.01" min="0" value="'+(item?item.amount:'')+'" placeholder="0.00"></div>'+
          '<div class="field"><label>Status</label><select id="qStatus">'+statusOpts+'</select></div>'+
        '</div>'+
        '<div class="field"><label>Margin override %</label><input id="qMargin" type="number" step="0.1" min="0" value="'+(item&&item.margin!==undefined&&item.margin!==null?item.margin:'')+'" placeholder="Default '+DEFAULT_MARGIN+'%"><div class="field-hint">Applied to approved quotes to work out what to charge the customer. Leave blank to use the default '+DEFAULT_MARGIN+'%.</div></div>'+
        '<div class="field"><label>Trade quote (PDF or image)</label>'+
          '<div id="qPdfCurrent">'+(item&&item.pdfName ? (isImageFile(item.pdfName) ? '🖼️ ' : '📎 ')+'<strong>'+esc(item.pdfName)+'</strong> — <a href="#" id="qPdfView">View</a> · <a href="#" id="qPdfRemove">Remove</a>' : '')+'</div>'+
          '<input id="qPdfFile" type="file" accept="application/pdf,image/*" style="margin-top:6px;">'+
          '<div class="field-hint">Upload the PDF quote from your email, or a photo/screenshot of the price if that\'s all you have. You can pull it back up from the Quotes tab at any time.</div>'+
        '</div>'+
      '</div>'+
      '<div class="modal-foot"><button class="btn btn-secondary" id="mCancel">Cancel</button><button class="btn btn-primary" id="mSave">'+(isEdit?'Save changes':'Add quote')+'</button></div>'
    );
    let pdfRemoved = false;
    document.getElementById('mClose').addEventListener('click', closeModal);
    document.getElementById('mCancel').addEventListener('click', closeModal);
    const pdfViewLink = document.getElementById('qPdfView');
    if(pdfViewLink){
      pdfViewLink.addEventListener('click', (e)=>{
        e.preventDefault();
        if(item && item.pdfData) openPdfDataUri(item.pdfData, item.pdfName);
      });
    }
    const pdfRemoveLink = document.getElementById('qPdfRemove');
    if(pdfRemoveLink){
      pdfRemoveLink.addEventListener('click', (e)=>{
        e.preventDefault();
        pdfRemoved = true;
        document.getElementById('qPdfCurrent').innerHTML = '<span class="field-hint">PDF will be removed when you save.</span>';
      });
    }
    document.getElementById('mSave').addEventListener('click', async ()=>{
      const description = document.getElementById('qDesc').value.trim();
      if(!description){ document.getElementById('qDesc').focus(); return; }
      const data = {
        description,
        trade: document.getElementById('qTrade').value.trim(),
        contactName: document.getElementById('qContact').value.trim(),
        phone: document.getElementById('qPhone').value.trim(),
        email: document.getElementById('qEmail').value.trim(),
        amount: parseFloat(document.getElementById('qAmount').value)||0,
        status: document.getElementById('qStatus').value,
        margin: document.getElementById('qMargin').value===''? null : parseFloat(document.getElementById('qMargin').value)
      };
      const fileInput = document.getElementById('qPdfFile');
      const file = fileInput.files && fileInput.files[0];
      if(file){
        const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
        const isImg = (file.type||'').indexOf('image/') === 0 || isImageFile(file.name);
        if(!isPdf && !isImg){
          alert('Please choose a PDF or an image file (JPG, PNG, etc).');
          return;
        }
        try{
          data.pdfData = await readFileAsDataURL(file);
          data.pdfName = file.name;
        }catch(e){
          alert('Could not read that file — please try again.');
          return;
        }
      } else if(pdfRemoved){
        data.pdfData = null;
        data.pdfName = null;
      }
      job.quotes = job.quotes || [];
      if(isEdit){ Object.assign(item, data); }
      else { data.id = uid(); job.quotes.push(data); }
      await saveJob(job);
      closeModal();
      renderMain();
      if(job.driveSheetId) pushQuotesToSheet(job);
      if(file && job.driveQuotesFolderId && driveConnected){
        ensureDriveToken().then(ok=>{
          if(ok) driveUploadFile(data.pdfData, data.pdfName, job.driveQuotesFolderId).catch(e=>console.error('Quote file upload failed', e));
        });
      }
    });
  }

        '</div>'+
        '<div class="field"><label>Status</label><select id="tStatus">'+statusOpts+'</select></div>'+

      let end = document.getElementById('tEnd').value || start;

      const data = {
        trade,
        description: document.getElementById('tDesc').value.trim(),
        start, end,
        status: document.getElementById('tStatus').value,

      };
      job.timeline = job.timeline || [];
      if(isEdit){ Object.assign(item, data); }
      else { data.id = uid(); job.timeline.push(data); }
      await saveJob(job);
      closeModal();
      renderMain();
    });

  // ---------------- Backup / Restore ----------------
  // Backup pulls every job (not just cached ones) straight from IndexedDB and
  // bundles it with the job index into one JSON file the browser downloads.
  // Because it's a normal file, you can save it to Google Drive, iCloud,
  // Dropbox, email it to yourself, etc. — so your data isn't only as safe as
  // this one HTML file's local storage.
  async function exportBackup(){
    try{
      const idxRaw = await idbGet(STORAGE_PREFIX+'job-index');
      const idx = idxRaw ? JSON.parse(idxRaw) : [];
      const jobsOut = {};
      for(const entry of idx){
        const raw = await idbGet(STORAGE_PREFIX+'job:'+entry.id);
        if(raw){
          try{ jobsOut[entry.id] = JSON.parse(raw); }catch(e){ /* skip corrupt entry */ }
        }
      }
      const backup = {
        app: 'ch-scheduler-backup',
        version: 1,
        exportedAt: new Date().toISOString(),
        jobIndex: idx,
        jobs: jobsOut
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = 'ch-scheduler-backup-'+stamp+'.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 30000);
    }catch(e){
      alert('Backup failed: '+(e && e.message ? e.message : e));
    }
  }

  function triggerRestorePicker(){
    document.getElementById('restoreFileInput').click();
  }

  async function importBackupFile(file){
    let backup;
    try{
      const text = await file.text();
      backup = JSON.parse(text);
    }catch(e){
      alert('That file doesn\'t look like a valid backup (couldn\'t parse JSON).');
      return;
    }
    if(!backup || !backup.jobIndex || !backup.jobs){
      alert('That file doesn\'t look like a CH Scheduler backup.');
      return;
    }
    const incomingCount = backup.jobIndex.length;
    const existingIds = new Set(jobIndex.map(j=>j.id));
    const overlapCount = backup.jobIndex.filter(j=>existingIds.has(j.id)).length;
    const msg = overlapCount > 0
      ? 'This backup has '+incomingCount+' job(s), '+overlapCount+' of which already exist here. '+
        'Importing will overwrite those with the backup\'s version and add any new ones. Continue?'
      : 'Import '+incomingCount+' job(s) from this backup? They\'ll be added to your current list.';
    if(!confirm(msg)) return;

    try{
      setSaving(true);
      // Write every job from the backup into IndexedDB.
      for(const id in backup.jobs){
        await idbSet(STORAGE_PREFIX+'job:'+id, JSON.stringify(backup.jobs[id]));
        jobs[id] = backup.jobs[id];
      }
      // Merge indexes: backup entries win on id collision, keep anything
      // else that was already here.
      const merged = jobIndex.filter(j=>!backup.jobIndex.some(b=>b.id===j.id));
      for(const entry of backup.jobIndex){ merged.push(entry); }
      jobIndex = merged;
      await saveIndex();
      setSaving(false, true);
    }catch(e){
      setSaving(false, false);
      alert('Restore failed: '+(e && e.message ? e.message : e));
      return;
    }
    renderSidebar();
    renderMain();
    alert('Restored '+incomingCount+' job(s).');
  }

  // ---------------- Wire up global controls ----------------
  document.getElementById('newJobBtn').addEventListener('click', openNewJobModal);
  document.getElementById('jobSearch').addEventListener('input', (e)=>{
    searchTerm = e.target.value;
    renderSidebar();
  });
  document.getElementById('backupBtn').addEventListener('click', exportBackup);
  document.getElementById('restoreBtn').addEventListener('click', triggerRestorePicker);
  document.getElementById('restoreFileInput').addEventListener('change', (e)=>{
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(file) importBackupFile(file);
  });
  document.getElementById('driveConnectBtn').addEventListener('click', connectDrive);
  setDriveStatus('idle');
  initGoogleAuth();

  init();
})();
